name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# docker/build-push-action uploads a `.dockerbuild` build summary as a
# workflow artifact on every run. Nobody reads them, and they count against
# the 0.5 GB Actions storage quota: ~1000 of them had piled up across the
# personal repos by 2026-08-24, one per build, kept for the default 90 days.
env:
  DOCKER_BUILD_SUMMARY: false

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install --upgrade pip && pip install ruff
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  types:
    name: Type-check (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: mypy --strict src/ovispect

  test:
    name: Test (pytest, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run pytest
        run: pytest -v --cov=ovispect --cov-report=xml
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  dockerfile:
    name: Lint Dockerfile (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project (with dev + e2e extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,e2e]"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pyproject.toml') }}
      - name: Install Chromium
        # `--with-deps` pulls the system libraries (libnss3, libatk, …) the
        # browser needs on a bare ubuntu-latest runner. We always run it: the
        # OS-level apt packages aren't covered by the cache above.
        run: playwright install --with-deps chromium
      - name: Run e2e suite
        run: pytest -m e2e -v

  build:
    name: Build container image (smoke)
    runs-on: ubuntu-latest
    # Volontairement sans `needs:`. Quand ce job était gaté par les autres, le
    # moindre échec de lint le faisait *skipper* — et un job skippé se lit comme
    # un job vert dans le rollup de la PR. C'est ce qui a laissé le build cassé
    # tout le mois d'août sans que la CI ne rougisse (cf. #17).
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          # Charge l'image dans le daemon local pour le smoke-test ci-dessous.
          load: true
          tags: ovispect:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test (démarrage, uid non-root, HEALTHCHECK)
        run: |
          set -euo pipefail

          uid=$(docker run --rm --entrypoint /bin/sh ovispect:ci -c 'id -u')
          gid=$(docker run --rm --entrypoint /bin/sh ovispect:ci -c 'id -g')
          echo "uid=$uid gid=$gid"
          if [ "$uid" != "10001" ] || [ "$gid" != "10001" ]; then
            echo "::error::l'image doit tourner en 10001:10001, obtenu $uid:$gid"
            exit 1
          fi

          docker run -d --name ovispect-smoke \
            -e OPENVPN_HOST=127.0.0.1 \
            -e OPENVPN_PORT=7505 \
            ovispect:ci

          # Le HEALTHCHECK passe healthy en ~6 s ; on laisse 120 s de marge.
          for _ in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Running}}' ovispect-smoke)" != "true" ]; then
              code=$(docker inspect -f '{{.State.ExitCode}}' ovispect-smoke)
              echo "::error::le conteneur s'est arrêté (exit $code)"
              docker logs ovispect-smoke
              exit 1
            fi
            status=$(docker inspect -f '{{.State.Health.Status}}' ovispect-smoke)
            if [ "$status" = "healthy" ]; then
              echo "conteneur healthy"
              exit 0
            fi
            sleep 2
          done

          echo "::error::le conteneur n'est jamais devenu healthy (120 s)"
          docker inspect -f '{{json .State.Health}}' ovispect-smoke
          docker logs ovispect-smoke
          exit 1
